name: Build WSL2 Kernel (amd64-v3)

on:
  workflow_dispatch:           # trigger manually from the Actions tab
  push:
    tags:
      - 'v*'                   # or auto-trigger on new version tags

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Install build dependencies ───────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison bc \
            libssl-dev libelf-dev libncurses-dev \
            dwarves pahole git

      # ── 2. Checkout Microsoft WSL2 kernel source ─────────────────────────
      - name: Checkout WSL2 kernel
        uses: actions/checkout@v4
        with:
          repository: microsoft/WSL2-Linux-Kernel
          ref: linux-msft-wsl-6.18.y    # Note: change to a valid branch like 6.1.y or 6.6.y
          depth: 1

      # ── 3. Prepare config and headers (Fixes linux/compiler.h error) ─────
      - name: Configure and prepare kernel
        run: |
          cp Microsoft/config-wsl .config

          # Label the kernel so you recognise it in uname -r
          # (single source of truth: do NOT also pass LOCALVERSION= to make,
          #  or the suffix gets applied twice)
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-wsl2-x86_64-v3"/' .config

          # ── Rootless container networking (podman + pasta/slirp4netns) ──
          # CONFIG_TUN: /dev/net/tun, required by pasta and slirp4netns
          for opt in \
            TUN \
            BRIDGE \
            VETH \
          ; do
            ./scripts/config --file .config --enable CONFIG_$opt
          done

          # ── ccbox --with-firewall support (iptables-legacy + ipset) ──────
          # init-firewall.sh uses iptables (filter/nat/mangle) + ipset hash:net.
          # WSL2 bzImage has no module tree, so everything must be =y.
          for opt in \
            NETFILTER \
            NETFILTER_ADVANCED \
            NETFILTER_XTABLES \
            NETFILTER_XTABLES_LEGACY \
            NF_CONNTRACK \
            NF_NAT \
            IP_NF_IPTABLES \
            IP_NF_FILTER \
            IP_NF_IPTABLES_LEGACY \
            IP_NF_NAT \
            IP_NF_MANGLE \
            IP_NF_TARGET_MASQUERADE \
            IP_NF_TARGET_REJECT \
            NETFILTER_XT_MATCH_CONNTRACK \
            NETFILTER_XT_MATCH_STATE \
            NETFILTER_XT_MATCH_COMMENT \
            NETFILTER_XT_MATCH_OWNER \
            NETFILTER_XT_MATCH_MULTIPORT \
            NETFILTER_XT_TARGET_MASQUERADE \
            NETFILTER_XT_SET \
            IP_SET \
            IP_SET_HASH_NET \
            IP_SET_HASH_IP \
          ; do
            ./scripts/config --file .config --enable CONFIG_$opt
          done

          # Accept all new config options as defaults (avoids interactive prompts)
          make olddefconfig

          # Second pass: promote any of our options that got demoted to =m
          # (happens when a dependency was only tristate on the first pass)
          for opt in $ALL_OPTS; do
            if grep -q "^CONFIG_${opt}=m" .config; then
              echo "Promoting CONFIG_${opt} from m to y"
              ./scripts/config --file .config --enable CONFIG_$opt
            fi
          done
          # B. Build everything in. No modules to install: in step 3, after copying the config, turn every =m  into =y:
          sed -i 's/=m$/=y/' .config
          make olddefconfig

          # Sanity check: fail the build early if critical options didn't stick.
          # (options with Kconfig deps can silently revert during olddefconfig)
          for req in \
            TUN \
            NETFILTER_XTABLES \
            IP_NF_IPTABLES \
            IP_NF_FILTER \
            IP_NF_NAT \
            IP_NF_MANGLE \
            IP_SET \
            IP_SET_HASH_NET \
          ; do
            grep -q "^CONFIG_${req}=y" .config || {
              echo "::error::CONFIG_${req} not enabled after olddefconfig!"
              grep "CONFIG_${req}[ =]" .config || echo "CONFIG_${req} absent from .config"
              exit 1
            }
          done
          echo "All required kernel options confirmed =y"

          # Generate headers and scripts required by objtool BEFORE building
          make prepare
          make scripts

      # ── 4. Compile with amd64-v3 flags ───────────────────────────────────
      - name: Build kernel
        run: |
          # The Kernel Makefile requires KCFLAGS to append compiler flags, not CFLAGS
          # LOCALVERSION deliberately NOT passed here: CONFIG_LOCALVERSION in
          # .config is the single source of truth (avoids doubled suffix like
          # 6.18.x-wsl2-x86_64-v3-wsl2-x86_64-v3)
          make -j$(nproc) \
            KCONFIG_CONFIG=.config \
            KCFLAGS="-march=x86-64-v3 -mtune=generic" \
            KCPPFLAGS="-march=x86-64-v3 -mtune=generic"

      # ── 5. Upload bzImage as a downloadable artifact ─────────────────────
      - name: Upload bzImage
        uses: actions/upload-artifact@v4
        with:
          name: bzImage-wsl2-x86_64-v3
          path: arch/x86/boot/bzImage
          retention-days: 30

      # ── 6. Upload final .config for auditing/debugging ────────────────────
      - name: Upload kernel config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config-wsl2-x86_64-v3
          path: .config
          retention-days: 30
